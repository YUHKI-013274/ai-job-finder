name: 毎朝AI案件取得

on:
  # 毎朝の自動cron実行は停止済み（CrowdWorks側の403によりGitHub Actionsからの
  # 直接アクセスが機能しないため。ローカルPC実行に一本化。データ破損リスク回避のため
  # 自動トリガーはこのワークフローから撤去した。手動実行のみ残す）。
  workflow_dispatch:

jobs:
  fetch-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    permissions:
      contents: write  # gh-pagesへのpushに必要

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Node.js セットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 依存パッケージをインストール
        run: npm ci

      - name: Playwright Chromium をインストール
        run: npx playwright install chromium --with-deps

      - name: 案件取得・HTML生成
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          APPLIED_SHEET_URL: ${{ secrets.APPLIED_SHEET_URL }}
        run: node run.js

      - name: 既出・応募済みデータをmasterへ保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "📋 既出・応募済みデータ更新 (run ${{ github.run_id }})"
          git push origin HEAD:master

      - name: GitHub Pages へデプロイ
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output
          publish_branch: gh-pages
          force_orphan: false
          commit_message: "📋 案件更新 ${{ github.run_id }}"
